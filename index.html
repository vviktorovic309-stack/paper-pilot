<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Бумажный пилот</title>
<style>
:root{--bg:#0f1114;--mbg:#11110f;--ink:#f1ede4;--sky:#30aae2;--gold:#ffc83d;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;font-weight:700;font-size:20px;pointer-events:none}
#hud b{color:var(--gold)}
#pw{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 42px);font-size:18px;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(15,17,20,.72);text-align:center;padding:24px;overflow:auto}
#ov img{width:84px;height:84px;border-radius:20px}
#ov h1{margin:4px 0 0;font-size:28px}
#ov p{margin:0;opacity:.8;max-width:290px;line-height:1.4;font-size:15px}
button{border:0;border-radius:16px;font:700 17px inherit;padding:13px 36px;color:#06222f;background:var(--sky)}
button.alt{background:transparent;color:var(--ink);border:2px solid #3a4048;padding:9px 24px;font-size:15px}
input{background:#1a1e23;border:2px solid #3a4048;border-radius:12px;color:var(--ink);font:16px inherit;padding:9px 12px;text-align:center;width:200px}
#lb{width:min(300px,100%);text-align:left;font-size:15px}
#lb div{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #2a2f36}
#lb div.me{color:var(--gold);font-weight:700}
#lb small{opacity:.6;display:block;text-align:center;padding:6px}
#fr{width:min(300px,100%);font-size:15px}#fr p{margin:6px auto}.row{display:flex;gap:8px;justify-content:center;margin:8px 0}.row button{padding:11px 18px;font-size:15px}#rl{width:100%;box-sizing:border-box;font-size:12px}#fr small{opacity:.6;display:block}
button:disabled{opacity:.45}
#ov{z-index:6;padding-bottom:100px}
#menu{position:fixed;inset:0;z-index:5;background:var(--mbg)}
#bg{width:100%;height:100%;object-fit:contain;display:block}
#mtop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:104px;display:flex;flex-wrap:wrap;justify-content:flex-start;padding-left:12px;gap:8px}
i{font-style:normal}
.chip{background:rgba(15,17,20,.75);border:1px solid #2a2f36;border-radius:999px;padding:6px 14px;font-weight:700}
.chip b{color:var(--gold)}
.panel{position:fixed;inset:0;z-index:7;background:rgba(15,17,20,.72);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px 110px}
.panel>*{max-width:320px;width:100%;box-sizing:border-box}
.panel h2{margin:0;font-size:26px}.panel p{margin:4px 0;opacity:.85;line-height:1.4}.panel small{opacity:.65;display:block}
.panel input{width:100%}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#171b20;border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left}
.task small{display:block;opacity:.65}.task button{padding:8px 14px;font-size:14px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(15,17,20,.94);border-top:1px solid #2a2f36}
#nav button{background:none;color:var(--ink);border-radius:14px;padding:8px 0;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.75}
#nav button span{font-size:12px;font-weight:700}
#nav button.on{opacity:1;background:#1c2128}
#nav button.main{background:var(--sky);color:#06222f;opacity:1}
#nav button.main.on{box-shadow:0 0 0 2px var(--ink)}
#home{position:fixed;z-index:11;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);padding:7px 14px;font-size:14px;background:rgba(15,17,20,.8);color:var(--ink);border:1px solid #2a2f36}
body:not([data-s=menu]) #wbw,body:not([data-s=menu]) #mtop,body:not([data-s=menu]) #lg,body:not([data-s=menu]) #lm,body.play #menu,body[data-s=menu] #home,body.play #home,body.play #nav,body:not(.play) #hud,body:not(.play) #pw{display:none}
#lg{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:7px 14px;font-size:14px;background:rgba(15,17,20,.75);color:var(--ink);border:1px solid #2a2f36}
#lm{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;display:flex;flex-direction:column;gap:4px;background:rgba(15,17,20,.96);border:1px solid #2a2f36;border-radius:14px;padding:6px}
#lm button{background:none;color:var(--ink);text-align:left;padding:9px 14px;font-size:15px;border-radius:10px}
#lm button.on{background:#1c2128;color:var(--gold)}
#wbw{position:absolute;z-index:2;right:20px;top:calc(env(safe-area-inset-top,0px) + 58px)}
#wbtn{display:block;width:62px;height:62px;padding:0;border-radius:50%;border:3px solid #f1ede4;background:conic-gradient(#30aae2 0deg 36deg,#f1ede4 36deg 72deg,#30aae2 72deg 108deg,#f1ede4 108deg 144deg,#30aae2 144deg 180deg,#f1ede4 180deg 216deg,#30aae2 216deg 252deg,#f1ede4 252deg 288deg,#30aae2 288deg 324deg,#f1ede4 324deg 360deg);box-shadow:0 0 18px rgba(48,170,226,.55);animation:spin 9s linear infinite;position:relative}
#wbtn::after{content:"";position:absolute;inset:20px;border-radius:50%;background:#0f1114;border:2px solid #f1ede4}
#wdot{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#ff4d4d;border:2px solid #0f1114}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;justify-content:center}
.rk{width:18px;height:18px;vertical-align:-3px}
#wwrap{position:relative;max-width:300px;margin:8px auto;aspect-ratio:1}
#wptr{position:absolute;z-index:2;left:50%;top:-8px;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--gold);filter:drop-shadow(0 2px 3px #000)}
#wc{display:block;width:100%;transition:transform 5s cubic-bezier(.17,.67,.12,1)}
#pwh .row button{flex:1;padding:11px 8px}
#wr{min-height:22px;font-weight:700;color:var(--gold)}
.hide{display:none!important}
</style>

async function submit(sc){
 if(API&&tg&&tg.initData){api('/submit',{score:sc,name:myName()});return}
 if(!db||!uid)return;
 try{const r=db.collection('scores').doc(uid),s=await r.get();
  if(!s.exists||(s.data().score||0)<sc)await r.set({name:myName(),score:sc,t:Date.now()})}catch(e){}}
async function showBoard(){
 const box=$('lb');box.classList.remove('hide');box.innerHTML='';
 const add=(n,v,me)=>{const r=document.createElement('div');if(me)r.className='me';const a=document.createElement('span'),b=document.createElement('span');a.textContent=n;b.textContent=v;r.append(a,b);box.append(r)};
 const note=t=>{const s=document.createElement('small');s.textContent=t;box.append(s)};
 if(API&&tg&&tg.initData){const r=await api('/leaderboard');
  if(r&&r.top){if(!r.top.length)note(T('first'));
   r.top.forEach((v,i)=>add((i+1)+'. '+String(v.name).slice(0,14),v.score,String(v.id)===String(tuid)));
   if(r.me&&r.me.rank>10){note('· · ·');add(r.me.rank+'. '+T('you'),r.me.score,true)}return}}
 if(db){try{const q=await db.collection('scores').orderBy('score','desc').limit(10).get();
   if(q.empty)note(T('first'));
   q.docs.forEach((d,i)=>{const v=d.data();add((i+1)+'. '+String(v.name||'Пилот').slice(0,14),v.score,d.id===uid)});return}catch(e){}}
 add(T('mybest'),best,true);
 note(T('localn'));
}
$('lbb').onclick=e=>{e.stopPropagation();$('lb').classList.contains('hide')?showBoard():$('lb').classList.add('hide')};

// ---- игра ----
let st='menu',p,obs,coins,bons,parts,dist,got,speed,hold=false,lastX,prevGap,count,mag,shield,inv;
const stars=Array.from({length:60},()=>({x:Math.random()*600,y:Math.random()*H,z:.2+Math.random()*.6}));
function reset(){p={x:W*.28,y:H/2,vy:0};obs=[];coins=[];bons=[];parts=[];dist=0;got=0;speed=190;lastX=W+80;prevGap=H/2;count=0;mag=0;shield=!!(ls.get('pp_inv')||refCount>0);inv=0}
function spawn(){
 const gh=Math.max(150,215-dist/60),gap=Math.min(H-gh/2-95,Math.max(gh/2+95,prevGap+(Math.random()-.5)*260));
 const r=Math.random(),kd=count<2?'pillar':r<.34?'pillar':r<.67?'cloud':'rock';count++;
 obs.push({x:lastX,w:kd==='cloud'?64:56,gap,gh,k:kd,ph:Math.random()*6});
 const sp=270,x0=lastX-sp+70,x1=lastX-70;
 for(let i=0;i<5;i++){const t=i/4;coins.push({x:x0+(x1-x0)*t,y:prevGap+(gap-prevGap)*t-Math.sin(t*Math.PI)*30,ph:Math.random()*6})}
 coins.push({x:lastX+30,y:gap,ph:0});
 if(count>3&&Math.random()<.22)bons.push({x:lastX-sp/2,y:(prevGap+gap)/2,t:Math.random()<.5?'mag':'sh'});
 prevGap=gap;lastX+=sp;
}
const gapNow=o=>o.k==='rock'?o.gap+Math.sin(o.ph+dist/90)*42:o.gap;
function start(){ls.set('pp_name',myName());reset();st='play';document.body.classList.add('play');$('ov').classList.add('hide');$('lb').classList.add('hide')}
function die(){st='over';document.body.classList.remove('play');buzz('heavy');endRun();const sc=Math.floor(dist/10)+got*10;
 if(sc>best){best=sc;ls.set('pp_best',best)}submit(sc);
 ovMode='over';lastRes={sc:sc,got:got};renderOv();
 setTimeout(()=>{if(scr==='game'){$('ov').classList.remove('hide');showBoard()}},450)}
$('go').onclick=e=>{e.stopPropagation();start()};
$('ov').addEventListener('pointerdown',e=>e.stopPropagation());
addEventListener('pointerdown',()=>{if(st==='play')hold=true});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{hold=false}));
addEventListener('keydown',e=>{if(e.code==='Space'&&scr==='game'){if(st!=='play')start();else hold=true}});
addEventListener('keyup',e=>{if(e.code==='Space')hold=false});

function hit(){if(inv>0)return false;if(shield){shield=false;inv=1.3;buzz('medium');return false}return true}
function update(dt){
 speed=Math.min(340,190+dist/40);
 p.vy+=(hold?-1500:900)*dt;p.vy=Math.max(-300,Math.min(360,p.vy));p.y+=p.vy*dt;
 dist+=speed*dt;inv=Math.max(0,inv-dt);mag=Math.max(0,mag-dt);
 while(lastX<W+300)spawn();
 for(const o of obs)o.x-=speed*dt;for(const c of coins)c.x-=speed*dt;for(const b of bons)b.x-=speed*dt;
 obs=obs.filter(o=>o.x>-100);coins=coins.filter(c=>c.x>-30);bons=bons.filter(b=>b.x>-30);lastX-=speed*dt;
 if(p.y<8||p.y>H-8){if(hit())return die();p.y=Math.max(10,Math.min(H-10,p.y));p.vy=0}
 const r=13;
 for(const o of obs){if(p.x+r>o.x&&p.x-r<o.x+o.w){const g=gapNow(o);
   if(p.y-r<g-o.gh/2||p.y+r>g+o.gh/2){if(hit())return die()}}}
 for(let i=coins.length-1;i>=0;i--){const c=coins[i],dx=p.x-c.x,dy=p.y-c.y,dd=Math.hypot(dx,dy);
  if(mag>0&&dd<190&&dd>1){c.x+=dx/dd*460*dt;c.y+=dy/dd*460*dt}
  if(dd<26){coins.splice(i,1);got++;buzz('light');
   for(let j=0;j<6;j++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.5,c:'#ffc83d'})}}
 for(let i=bons.length-1;i>=0;i--){const b=bons[i];
  if(Math.hypot(b.x-p.x,b.y-p.y)<30){bons.splice(i,1);buzz('medium');if(b.t==='mag')mag=8;else shield=true}}
 parts.push({x:p.x-24,y:p.y+6,vx:-speed,vy:(Math.random()-.5)*30,l:.4,c:'#30aae2'});
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 $('d').textContent=Math.floor(dist/10);$('m').textContent=got;
 $('pw').textContent=(mag>0?'🧲 '+Math.ceil(mag)+T('sec')+'  ':'')+(shield?'🛡️':'');
}

function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function cloudCol(o,y0,y1,top){ // облачный столб: круглые «пухи»
 ctx.fillStyle='#dfe9f2';const cx=o.x+o.w/2,R=o.w/2;
 const a=Math.min(y0,y1),b=Math.max(y0,y1);
 ctx.fillRect(o.x+4,a,o.w-8,b-a);
 for(let y=a;y<=b+R;y+=R*.7){ctx.beginPath();ctx.arc(cx+(((y/20)|0)%2?-4:4),y,R,0,7);ctx.fill()}
 ctx.fillStyle='#bcd2e4';ctx.beginPath();ctx.arc(cx,top?b:a,R*.55,0,7);ctx.fill()}
function rock(o,y,h,g){
 rr(o.x,y,o.w,h,20,'#8c8279');ctx.fillStyle='#6b625b';
 for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(o.x+14+i%2*24,y+(g?h-30:30)+(i-1)*(g?-22:22),6+i*2,0,7);ctx.fill()}
 rr(o.x+6,y+(g?h-10:2),o.w-12,8,4,'#a79c91')}
function draw(t){
 ctx.setTransform(dpr*k,0,0,dpr*k,0,0);ctx.fillStyle='#0f1114';ctx.fillRect(0,0,W,H);
 for(const s of stars){const x=((s.x-(dist||t/20)*s.z*.6)%W+W)%W;ctx.fillStyle=s.z>.6?'#f1ede4':'#30aae2';ctx.globalAlpha=s.z;ctx.fillRect(x,s.y,2*s.z+1,2*s.z+1)}
 ctx.globalAlpha=1;if(st==='menu')return;
 for(const o of obs){const g=gapNow(o),t0=g-o.gh/2,b0=g+o.gh/2;
  if(o.k==='pillar'){rr(o.x,-20,o.w,t0+20,12,'#f1ede4');rr(o.x,b0,o.w,H-b0+20,12,'#f1ede4');rr(o.x-4,t0-14,o.w+8,14,7,'#30aae2');rr(o.x-4,b0,o.w+8,14,7,'#30aae2')}
  else if(o.k==='cloud'){cloudCol(o,-30,t0-o.w/2,1);cloudCol(o,b0+o.w/2,H+30,0)}
  else{rock(o,-20,t0+20,1);rock(o,b0,H-b0+20,0)}}
 for(const c of coins){const w=Math.abs(Math.cos(t/220+c.ph));
  ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.ellipse(c.x,c.y,10*w+2,10,0,0,7);ctx.fill();
  ctx.fillStyle='#b8860b';ctx.beginPath();ctx.ellipse(c.x,c.y,5*w+1,5,0,0,7);ctx.fill()}
 for(const b of bons){const f=b.t==='mag'?'#ff6b6b':'#30aae2',y=b.y+Math.sin(t/250)*4;
  ctx.fillStyle='#0f1114';ctx.strokeStyle=f;ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,y,16,0,7);ctx.fill();ctx.stroke();
  ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.t==='mag'?'🧲':'🛡️',b.x,y+1)}
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)}
 ctx.globalAlpha=1;
 if(ready){ctx.save();ctx.translate(p.x,p.y);
  if(inv>0&&((t/90)|0)%2)ctx.globalAlpha=.4;
  ctx.rotate(0.37+p.vy/900);ctx.drawImage(spr,-34,-34,68,68);ctx.restore();ctx.globalAlpha=1}
 if(shield||inv>0){ctx.strokeStyle='#30aae2';ctx.lineWidth=3;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(p.x,p.y,28,0,7);ctx.stroke();ctx.globalAlpha=1}
 if(mag>0){ctx.strokeStyle='#ff6b6b';ctx.lineWidth=1.5;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(p.x,p.y,40+(t/12)%150,0,7);ctx.stroke();ctx.globalAlpha=1}
}

Object.assign(DICT.ru,{"refBonus": "За каждого друга: +1000 🪙, если у него Telegram Premium, и +500 🪙, если нет.", "refGot": "Начислено за друзей:"});Object.assign(DICT.en,{"refBonus": "For each friend: +1000 🪙 if they have Telegram Premium, +500 🪙 if not.", "refGot": "Friend rewards credited:"});Object.assign(DICT.uk,{"refBonus": "За кожного друга: +1000 🪙, якщо в нього Telegram Premium, і +500 🪙, якщо ні.", "refGot": "Нараховано за друзів:"});Object.assign(DICT.es,{"refBonus": "Por cada amigo: +1000 🪙 si tiene Telegram Premium y +500 🪙 si no.", "refGot": "Recompensa por amigos:"});
const LMAP={ru:'ru',be:'ru',kk:'ru',uk:'uk',es:'es',en:'en'};
let lang=ls.get('pp_lang');
if(!DICT[lang]){const lc=String((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||navigator.language||'en').slice(0,2).toLowerCase();lang=LMAP[lc]||'en'}
const T=k=>(DICT[lang]&&DICT[lang][k])||DICT.ru[k]||k;
let ovMode='intro',lastRes={sc:0,got:0};
function renderOv(){
 if(ovMode==='over'){$('t').textContent=T('over');$('s').innerHTML=T('res')+' <b>'+lastRes.sc+'</b> · '+T('coinsn')+' '+lastRes.got+'<br>'+T('rec')+': '+best;$('go').textContent=T('again')}
 else{$('t').textContent=T('title');$('s').textContent=T('intro');$('go').textContent=T('play')}}
function applyLang(){
 document.documentElement.lang=lang;document.title=T('title');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
 $('lg').textContent='🌐 '+lang.toUpperCase();
 document.querySelectorAll('#lm button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 renderOv();updBal();
 if(scr==='friends')renderFr();if(scr==='tasks')renderTasks();if(scr==='wd')renderWd()}
$('lg').onclick=e=>{e.stopPropagation();$('lm').classList.toggle('hide')};
document.querySelectorAll('#lm button').forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.l;ls.set('pp_lang',lang);$('lm').classList.add('hide');applyLang()});
$('menu').addEventListener('click',()=>$('lm').classList.add('hide'));

// ---- меню и экраны ----
let scr='menu',rank=+ls.get('pp_rank')||0,bal=+ls.get('pp_bal')||0,tc=+ls.get('pp_tc')||0,td=+ls.get('pp_td')||0,games=+ls.get('pp_g')||0,claimed={};
try{claimed=JSON.parse(ls.get('pp_cl')||'{}')}catch(e){}
const MIN_WD=1000;
const saveStats=()=>{ls.set('pp_bal',bal);ls.set('pp_rank',rank);ls.set('pp_tc',tc);ls.set('pp_td',td);ls.set('pp_g',games);ls.set('pp_cl',JSON.stringify(claimed))};
function updBal(){$('b1').textContent=bal;$('b2').textContent=rank;$('bst').textContent=best;$('b3').textContent=rank;$('b4').textContent=rank;$('b5').textContent=bal}
function endRun(){bal+=got;tc+=got;td+=Math.floor(dist/10);games++;saveStats();updBal()}
const CHAT_URL='https://t.me/onrankchat'; // ссылка на чат: впишите, например 'https://t.me/имя_чата'
const TASKS=[
 {id:'tok',k:'tk_token',url:'https://onrank.lol/launch',r:5000},
 {id:'ch',k:'tk_ch',url:'https://t.me/onranknews',r:100},
 {id:'cht',k:'tk_chat',url:CHAT_URL,r:100},
 {id:'bot',k:'tk_bot',url:'https://t.me/onrankbot?startapp=ref_f6mwb2ur',r:100},
 {id:'g3',k:'tk_g3',get:()=>games,goal:3,r:20},
 {id:'c100',k:'tk_c100',get:()=>tc,goal:100,r:30},
 {id:'sc300',k:'tk_sc300',get:()=>best,goal:300,r:50},
 {id:'d1000',k:'tk_d1000',get:()=>td,goal:1000,r:40},
 {id:'f1',k:'tk_f1',get:()=>refCount,goal:1,r:100}];
function openLink(u){try{if(tg&&/^https:\/\/t\.me\//.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else location.href=u}catch(x){}}
function claim(t){claimed[t.id]=1;bal+=t.r;saveStats();updBal();buzz('medium');renderTasks()}
function renderTasks(){const box=$('tl');box.innerHTML='';
 TASKS.filter(t=>t.get||t.url).forEach(t=>{
  const cl=claimed[t.id],lk=!t.get,v=lk?0:Math.min(t.get(),t.goal),ok=lk||v>=t.goal;
  const r=document.createElement('div');r.className='task';
  const a=document.createElement('div'),b1=document.createElement('b'),sm=document.createElement('small');
  b1.textContent=T(t.k);sm.textContent=(lk?'':v+' / '+t.goal+' · ')+T('reward')+' '+t.r+' 🪙';a.append(b1,sm);
  const op=lk&&+ls.get('pp_op_'+t.id),b=document.createElement('button');
  b.textContent=cl?'✓':lk?(op?T('check'):T('go')):T('claim');b.disabled=!!cl||(!lk&&!ok);
  b.onclick=e=>{e.stopPropagation();
   if(!lk)return claim(t);
   if(!op){ls.set('pp_op_'+t.id,Date.now());openLink(t.url);return renderTasks()}
   b.disabled=true;b.textContent='…';setTimeout(()=>claim(t),1500)};
  r.append(a,b);box.append(r)})}
function renderWd(){const need=MIN_WD-rank;$('wn').textContent=need>0?T('wdMin')+' '+MIN_WD+' Rank. '+T('wdLack')+' '+need+' Rank.':T('wdOk');$('wb').disabled=need>0;$('wm').textContent=''}
$('wb').onclick=async e=>{e.stopPropagation();const w=$('wa').value.trim();
 if(w.length<5){$('wm').textContent=T('wdNeed');return}
 const r=await api('/withdraw',{amount:rank,currency:'RANK',wallet:w});
 $('wm').textContent=r&&r.ok?T('wdSent'):T('wdOff')};
const PANELS={friends:'pf',tasks:'pt',wd:'pd',wheel:'pwh'};
function go(s){scr=s;$('lm').classList.add('hide');document.body.dataset.s=s;
 ['pf','pt','pd','pwh'].forEach(id=>$(id).classList.toggle('hide',id!==PANELS[s]));
 $('ov').classList.toggle('hide',!(s==='game'&&st!=='play'));
 if(s==='friends'){renderFr();syncRefs()}if(s==='tasks')renderTasks();if(s==='wd')renderWd();if(s==='wheel'){drawWheel();wUi()}
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.s)});
$('home').onclick=e=>{e.stopPropagation();go('menu')};
// ---- колесо фортуны ----
const SECT=[['r',5],['c',50],['r',10],['r',15],['c',100],['r',5],['r',10],['c',50],['r',15],['c',500]];
const WSPIN=1000,DAY=864e5;let wrot=0,wbusy=false;
function drawWheel(){
 const c=$('wc'),x=c.getContext('2d'),S=c.width,R=S/2-8,n=SECT.length,st=Math.PI*2/n;
 x.clearRect(0,0,S,S);x.save();x.translate(S/2,S/2);
 x.beginPath();x.arc(0,0,R+6,0,7);x.fillStyle='#f1ede4';x.fill();
 SECT.forEach(([k,v],i)=>{
  const a0=-Math.PI/2+i*st;
  x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a0+st);x.closePath();
  x.fillStyle=k==='r'?(i%4<2?'#2b8fc2':'#1f7aa8'):(i%4<2?'#d6a928':'#b88f1e');x.fill();
  x.strokeStyle='#f1ede4';x.lineWidth=4;x.stroke();
  x.save();x.rotate(a0+st/2);
  x.fillStyle='#fff';x.font='bold 42px "Trebuchet MS",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=4;x.fillText(v,R*.5,0);x.shadowBlur=0;
  if(k==='r'){if(ready)x.drawImage(spr,R*.8-30,-30,60,60)}
  else{x.beginPath();x.arc(R*.8,0,22,0,7);x.fillStyle='#ffc83d';x.fill();x.strokeStyle='#8a6508';x.lineWidth=4;x.stroke();
   x.beginPath();x.arc(R*.8,0,10,0,7);x.strokeStyle='#8a6508';x.lineWidth=3;x.stroke()}
  x.restore()});
 x.beginPath();x.arc(0,0,44,0,7);x.fillStyle='#0f1114';x.fill();x.strokeStyle='#f1ede4';x.lineWidth=5;x.stroke();
 if(ready)x.drawImage(spr,-32,-32,64,64);
 x.restore()}
const fmt=ms=>{const s=Math.ceil(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};
const freeLeft=()=>Math.max(0,DAY-(Date.now()-(+ls.get('pp_wf')||0)));
function wUi(){const fl=freeLeft();
 $('wfree').disabled=wbusy||fl>0;$('wpaid').disabled=wbusy||bal<WSPIN;
 $('wfree').textContent=T('wFree');$('wpaid').textContent=T('wPaid')+' '+WSPIN+' 🪙';
 $('wtm').textContent=fl>0?T('wIn')+' '+fmt(fl):'';
 $('wdot').classList.toggle('hide',fl>0)}
function spin(paid){
 if(wbusy)return;
 if(paid){if(bal<WSPIN)return;bal-=WSPIN}else{if(freeLeft()>0)return;ls.set('pp_wf',Date.now())}
 const u=new Uint32Array(1);crypto.getRandomValues(u);const W=SECT.map(z=>z[0]==='c'?11:6),tot=W.reduce((a,b)=>a+b,0);let q=u[0]%tot,i=0;while(q>=W[i]){q-=W[i];i++}const [k,v]=SECT[i];
 if(k==='c')bal+=v;else rank+=v;saveStats();
 wbusy=true;$('wr').textContent='';wUi();
 const st=360/SECT.length,c=i*st+st/2+(Math.random()-.5)*st*.6,fin=(360-c)%360,r0=((wrot%360)+360)%360,delta=((fin-r0)%360+360)%360;
 wrot+=360*5+delta;$('wc').style.transform='rotate('+wrot+'deg)';
 setTimeout(()=>{wbusy=false;updBal();$('wr').textContent=T('won')+' +'+v+(k==='c'?' 🪙':' Rank');buzz('heavy');wUi()},5200)}
$('wfree').onclick=e=>{e.stopPropagation();spin(false)};
$('wpaid').onclick=e=>{e.stopPropagation();spin(true)};
$('wbtn').onclick=e=>{e.stopPropagation();go('wheel')};
setInterval(()=>{if(!wbusy)wUi()},1000);

go('menu');applyLang();wUi();

let last=performance.now();
(function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;
 if(st==='play')update(dt);draw(t);requestAnimationFrame(loop)})(last);
</script>
